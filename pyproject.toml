[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maniloop"
version = "0.2.0"
description = "MuJoCo simulation loops for evaluating embodied model policies"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mujoco==3.12.0", "numpy==2.5.3", "Pillow==12.3.0", "openai==3.8.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
maniloop = "maniloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maniloop = ["ui/*.html", "ui/*.css", "ui/*.js", "assets/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
